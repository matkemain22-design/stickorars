services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      ORDERS_BACKEND_MODE: independent
      ORDERS_BACKEND_URL: http://orders:4000
      ORDERS_API_TOKEN: ${ORDERS_API_TOKEN:?Set ORDERS_API_TOKEN}
    depends_on:
      orders:
        condition: service_healthy
    networks: [private]
  orders:
    build: ../backend
    restart: unless-stopped
    environment:
      ORDERS_API_TOKEN: ${ORDERS_API_TOKEN:?Set ORDERS_API_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
    volumes: [orders-data:/data]
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [private]
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    networks: [private]
networks:
  private:
volumes:
  orders-data:
  caddy-data:
  caddy-config: